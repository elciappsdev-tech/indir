<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnonimX - Uygulamayı İndir</title>

  <!-- Open Graph / Meta Preview for Instagram, TikTok, WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AnonimX - Maskeleri Çıkar">
  <meta property="og:description" content="Sıfır ego, sıfır filtre, tamamen anonim. Şimdi App Store ve Google Play'de!">
  <meta property="og:image" content="https://elciappsdev-tech.github.io/indir/logo.png">
  <meta property="og:url" content="https://elciappsdev-tech.github.io/indir">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Immediate Device-Detection & Smart Redirect -->
  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      var appleStoreUrl = "https://apps.apple.com/tr/app/anonimx/id6828193058";
      var googlePlayUrl = "https://play.google.com/store/apps/details?id=com.anonimx.app";

      if (isIOS) {
        window.location.replace(appleStoreUrl);
      } else if (isAndroid) {
        window.location.replace(googlePlayUrl);
      }
    })();
  </script>

  <style>
    :root {
      --bg: #070c18;
      --card-bg: rgba(13, 21, 38, 0.7);
      --cyan: #00d2ff;
      --purple: #9d4edd;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #112240 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Spheres */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      opacity: 0.35;
    }
    .glow-1 { width: 450px; height: 450px; background: var(--cyan); top: 10%; left: 15%; }
    .glow-2 { width: 450px; height: 450px; background: var(--purple); bottom: 10%; right: 15%; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(0, 210, 255, 0.15);
      position: relative;
      z-index: 10;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 0 40px rgba(0, 210, 255, 0.6);
      margin-bottom: 24px;
      border: 2px solid rgba(0, 210, 255, 0.4);
    }

    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffffff, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.tagline {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin-bottom: 32px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px 24px;
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .btn-apple {
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-apple:hover {
      background: #111;
      border-color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 255, 255, 0.15);
    }

    .btn-google {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid rgba(56, 189, 248, 0.5);
    }
    .btn-google:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(56, 189, 248, 0.3);
    }

    .qr-section {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-code {
      width: 140px;
      height: 140px;
      border-radius: 16px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .qr-text {
      font-size: 13px;
      color: var(--text-sub);
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <img class="logo" src="logo.png" alt="AnonimX">
    <h1>AnonimX</h1>
    <p class="tagline">Maskeleri Çıkar • Gerçek Sen Ol</p>

    <div class="btn-group">
      <a class="store-btn btn-apple" href="https://apps.apple.com/tr/app/anonimx/id6828193058">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 1.01-2.87-.96.04-2.09.64-2.74 1.4-.55.63-.98 1.67-.93 2.71 1.07.08 2.05-.49 2.66-1.24z"/>
        </svg>
        App Store'dan İndir
      </a>

      <a class="store-btn btn-google" href="https://play.google.com/store/apps/details?id=com.anonimx.app">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.609 1.814L13.792 12 3.61 22.186c-.198-.198-.31-.476-.31-.786V2.6c0-.31.112-.588.31-.786zm11.233 11.233L4.858 3.063l11.458 6.615c.618.357.618.938 0 1.295l-1.474.074zm-1.05-1.047l2.524 2.524-11.458 6.615 8.934-9.139zM20.25 11.353l-3.375-1.95-2.025 2.025 2.025 2.025 3.375-1.95c.5-.29.5-.76 0-1.05z"/>
        </svg>
        Google Play'den İndir
      </a>
    </div>

    <div class="qr-section">
      <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Felciappsdev-tech.github.io%2Findir&bgcolor=ffffff&color=090e17" alt="QR Kodu Tara">
      <span class="qr-text">📱 Telefonunla kameradan taratıp hemen indir</span>
    </div>
  </div>

  <footer>
    © 2026 AnonimX • ElçiApps. Tüm hakları saklıdır.
  </footer>
</body>
</html>
